<h2>Real-Time Weather Based Risk</h2>

<div>
<p>Temperature: <span id="temperature">Loading...</span></p>
<p>Visibility: <span id="visibility">Loading...</span></p>
<p id="riskResult">Calculating accident risk...</p>
</div>

<script>

const apiKey = "9e2740e8728212893fddc5c8f5511a4e";

function getWeatherData() {

if (navigator.geolocation) {

navigator.geolocation.getCurrentPosition(async function(position){

const lat = position.coords.latitude;
const lon = position.coords.longitude;

const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

const response = await fetch(url);
const data = await response.json();

const temperature = data.main.temp;
const visibility = data.visibility / 1000;

document.getElementById("temperature").innerText = temperature + " °C";
document.getElementById("visibility").innerText = visibility + " km";

calculateRisk(temperature, visibility);

});

}

}

function calculateRisk(temp, visibility){

let risk = "Low Risk";

if(visibility < 3){
risk = "High Risk";
}
else if(visibility < 6){
risk = "Medium Risk";
}

document.getElementById("riskResult").innerText = "Accident Risk: " + risk;

}

getWeatherData();

</script>

<body>

<h1>AI Traffic Accident Risk Prediction</h1>

<label>Temperature</label>
<input type="range" min="0" max="40" id="temp">

<label>Visibility</label>
<input type="range" min="0" max="10" id="vis">

<br><br>

<button onclick="predict()">Predict Risk</button>

<p id="result"></p>

<script src="script.js"></script>

</body>

</html>
